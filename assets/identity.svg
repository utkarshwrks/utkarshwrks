<svg viewBox="0 0 880 230" width="880" height="230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The human behind the commits — Utkarsh, aka ut-code-crush. Backend-first builder, AI where it adds value. Fueled by chai, lofi on loop, night owl. Orbiting worlds: backend, AI/ML, open source, hackathons. Open to opportunities.">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="1" y="1" width="878" height="228" rx="16"/></clipPath>
    <style>
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .static { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .anim, .orbits { display: none; }
        .static { display: block; }
      }
    </style>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="878" height="228" rx="16" fill="#0b0f16" stroke="#21262d"/>

  <!-- night sky -->
  <g class="anim" clip-path="url(#cardClip)">
    <circle cx="200" cy="26" r="1" fill="#8b95a7"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="342" cy="44" r="1.1" fill="#8b95a7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="40" r="1.2" fill="#8b95a7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="66" r="1" fill="#8b95a7"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="622" cy="28" r="1.4" fill="#8b95a7"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="702" cy="50" r="1" fill="#8b95a7"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="762" cy="34" r="1.2" fill="#8b95a7"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="808" cy="72" r="1" fill="#8b95a7"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="118" r="1.3" fill="#8b95a7"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="548" cy="176" r="1" fill="#8b95a7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/></circle>
    <!-- shooting star -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.7;0.76;0.84;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="430 18;430 18;560 66;560 66" keyTimes="0;0.7;0.84;1" dur="7s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-30" y2="-11" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- identity -->
  <text x="30" y="38" font-size="10" letter-spacing="3" fill="#7d8590">THE HUMAN BEHIND THE COMMITS</text>
  <text x="30" y="86" font-size="24" font-weight="bold"><tspan fill="#3fb950">$</tspan><tspan fill="url(#ag)"> ut-code-crush</tspan></text>
  <g class="anim">
    <rect x="252" y="66" width="11" height="24" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="30" y="112" font-size="12" fill="#7d8590">backend-first builder · AI where it truly adds value</text>

  <!-- personality chips -->
  <g fill="none" stroke="#7d8590" stroke-width="1.2">
    <rect x="30" y="155" width="17" height="13" rx="2.5"/>
    <path d="M47 157.5 q6 0 6 4.5 q0 4.5 -6 4.5"/>
  </g>
  <g class="anim" fill="none" stroke="#22d3ee" stroke-width="1" stroke-linecap="round">
    <path d="M35 151 q2 -3 0 -6"><animate attributeName="opacity" values="0;0.8;0" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M42 151 q-2 -3 0 -6"><animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></path>
  </g>
  <text x="60" y="166" font-size="10" fill="#7d8590">fueled by chai</text>

  <path d="M161 167 a10 10 0 0 1 20 0" fill="none" stroke="#7d8590" stroke-width="1.4"/>
  <rect x="159" y="165" width="4.5" height="8" rx="1.5" fill="#7d8590"/>
  <rect x="178.5" y="165" width="4.5" height="8" rx="1.5" fill="#7d8590"/>
  <g class="anim" fill="url(#ag)">
    <rect x="192" y="167" width="3" height="5" rx="1"><animate attributeName="height" values="5;13;7;13;5" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="167;159;165;159;167" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="197" y="163" width="3" height="9" rx="1"><animate attributeName="height" values="9;4;13;4;9" dur="0.9s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y" values="163;168;159;168;163" dur="0.9s" begin="0.15s" repeatCount="indefinite"/></rect>
    <rect x="202" y="165" width="3" height="7" rx="1"><animate attributeName="height" values="7;12;5;12;7" dur="0.9s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="165;160;167;160;165" dur="0.9s" begin="0.3s" repeatCount="indefinite"/></rect>
  </g>
  <text x="214" y="166" font-size="10" fill="#7d8590">lofi on loop</text>

  <path d="M310 152 a9.5 9.5 0 1 0 8 15.5 a7 7 0 1 1 -8 -15.5 z" fill="#e3b341" opacity="0.9"/>
  <text x="330" y="166" font-size="10" fill="#7d8590">night owl</text>

  <text x="30" y="201" font-size="10" fill="#58606e">jabalpur · ist · b.tech cse (ai &amp; ml) · class of '28</text>

  <!-- orbit of worlds -->
  <circle cx="660" cy="118" r="52" fill="none" stroke="#202737" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="660" cy="118" r="86" fill="none" stroke="#202737" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="660" cy="118" r="17" fill="#0d1117" stroke="url(#ag)" stroke-width="1.3"/>
  <text x="660" y="122.5" font-size="12" fill="#e6edf3" text-anchor="middle">UK</text>

  <g class="orbits">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 660 118" to="360 660 118" dur="14s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 712 118" to="0 712 118" dur="14s" repeatCount="indefinite"/>
        <circle cx="712" cy="118" r="4" fill="#22d3ee"/>
        <text x="712" y="104" font-size="9.5" fill="#9aa4b2" text-anchor="middle">backend</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 608 118" to="0 608 118" dur="14s" repeatCount="indefinite"/>
        <circle cx="608" cy="118" r="4" fill="#818cf8"/>
        <text x="608" y="104" font-size="9.5" fill="#9aa4b2" text-anchor="middle">ai · ml</text>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 660 118" to="0 660 118" dur="22s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 746 118" to="360 746 118" dur="22s" repeatCount="indefinite"/>
        <circle cx="746" cy="118" r="4" fill="#818cf8"/>
        <text x="746" y="104" font-size="9.5" fill="#9aa4b2" text-anchor="middle">open source</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 574 118" to="360 574 118" dur="22s" repeatCount="indefinite"/>
        <circle cx="574" cy="118" r="4" fill="#22d3ee"/>
        <text x="574" y="104" font-size="9.5" fill="#9aa4b2" text-anchor="middle">hackathons</text>
      </g>
    </g>
  </g>
  <g class="static">
    <circle cx="712" cy="118" r="4" fill="#22d3ee"/><text x="712" y="104" font-size="9.5" fill="#9aa4b2" text-anchor="middle">backend</text>
    <circle cx="608" cy="118" r="4" fill="#818cf8"/><text x="608" y="104" font-size="9.5" fill="#9aa4b2" text-anchor="middle">ai · ml</text>
    <circle cx="660" cy="32" r="4" fill="#818cf8"/><text x="660" y="20" font-size="9.5" fill="#9aa4b2" text-anchor="middle">open source</text>
    <circle cx="660" cy="204" r="4" fill="#22d3ee"/><text x="660" y="220" font-size="9.5" fill="#9aa4b2" text-anchor="middle">hackathons</text>
  </g>

  <!-- open to opportunities -->
  <g class="anim">
    <circle cx="676" cy="205" r="3.5" fill="#3fb950"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="676" cy="205" r="3.5" fill="#3fb950" opacity="0.35"/>
  <text x="852" y="209" font-size="9" letter-spacing="2" fill="#7d8590" text-anchor="end">OPEN TO OPPORTUNITIES</text>
</svg>
