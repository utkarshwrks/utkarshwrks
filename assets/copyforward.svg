<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="auto" role="img" aria-label="Contribution graph animation showing momentum carried forward">
  <title>Momentum — carried forward, block by block</title>
  
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Selection glow -->
    <filter id="selectionGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Copy/paste visual -->
    <filter id="copyGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="280" rx="12" fill="#0d1117"/>
  <rect x="0" y="0" width="1000" height="280" rx="12" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="11.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <text x="30" y="32" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="11" letter-spacing="3" fill="#8b949e">MOMENTUM · CARRYING FORWARD</text>

  <!-- Divider line -->
  <line x1="30" y1="48" x2="970" y2="48" stroke="#21262d" stroke-width="1"/>
  
  <!-- Past/Future labels -->
  <text x="30" y="68" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="9" letter-spacing="1" fill="#484f58">PAST</text>
  <text x="870" y="68" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="9" letter-spacing="1" fill="#484f58" text-anchor="end">FUTURE</text>

  <!-- Contribution grid container -->
  <g transform="translate(30, 82)">
    <!-- All grid cells (48 columns x 5 rows = 240 cells) -->
    <!-- Each cell is 16x16 with 4px gap -->
    
    <!-- Row 0 -->
    <!-- Green cells that will be "cut" (animated) -->
    <g>
      <!-- Regular activity (always visible) -->
      <rect x="0" y="0" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="20" y="0" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="60" y="0" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="80" y="0" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="100" y="0" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="120" y="0" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="140" y="0" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="160" y="0" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="180" y="0" width="16" height="16" rx="2.5" fill="#26a641"/>
      
      <!-- SELECTED BLOCK 1: gets cut and pasted forward -->
      <rect x="40" y="0" width="16" height="16" rx="2.5" fill="#39d353">
        <animate attributeName="opacity" values="1;1;1;1;0;0;0;0;1" keyTimes="0;0.05;0.10;0.15;0.20;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#39d353;#39d353;#39d353;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353" keyTimes="0;0.05;0.10;0.15;0.20;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <!-- PASTED BLOCK 1: appears in future -->
      <rect x="880" y="0" width="16" height="16" rx="2.5" fill="#161b22">
        <animate attributeName="fill" values="#161b22;#161b22;#161b22;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353" keyTimes="0;0.05;0.10;0.15;0.20;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0;0;1;1;1;1;0" keyTimes="0;0.05;0.10;0.15;0.20;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <!-- SELECTION HIGHLIGHT: shows what's being selected -->
      <rect x="38" y="-2" width="20" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3">
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.05;0.10;0.15;0.20;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <!-- COPY EFFECT: visual feedback during copy -->
      <rect x="38" y="-2" width="20" height="20" rx="4" fill="#818cf8" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0.15;0.15;0;0;0;0" keyTimes="0;0.05;0.10;0.15;0.20;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="4;4;4;2;2;2;2;4;4" keyTimes="0;0.05;0.10;0.15;0.20;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Row 1 -->
    <g>
      <rect x="0" y="20" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="20" y="20" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="60" y="20" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="80" y="20" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="100" y="20" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="120" y="20" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="140" y="20" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="160" y="20" width="16" height="16" rx="2.5" fill="#006d32"/>
      
      <!-- SELECTED BLOCK 2 -->
      <rect x="40" y="20" width="16" height="16" rx="2.5" fill="#39d353">
        <animate attributeName="opacity" values="1;1;1;0;0;0;0;1;1" keyTimes="0;0.12;0.17;0.22;0.70;0.75;0.82;0.90;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#39d353;#39d353;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353;#39d353" keyTimes="0;0.12;0.17;0.22;0.70;0.75;0.82;0.90;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <!-- PASTED BLOCK 2 -->
      <rect x="900" y="20" width="16" height="16" rx="2.5" fill="#161b22">
        <animate attributeName="fill" values="#161b22;#161b22;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353;#161b22" keyTimes="0;0.12;0.17;0.22;0.70;0.75;0.82;0.90;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0;1;1;1;1;0;0" keyTimes="0;0.12;0.17;0.22;0.70;0.75;0.82;0.90;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <rect x="38" y="18" width="20" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3">
        <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.12;0.17;0.22;0.70;0.75;0.82;0.90;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Row 2 -->
    <g>
      <rect x="0" y="40" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="20" y="40" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="40" y="40" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="60" y="40" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="80" y="40" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="100" y="40" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="120" y="40" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="140" y="40" width="16" height="16" rx="2.5" fill="#26a641"/>
      
      <!-- SELECTED BLOCK 3 -->
      <rect x="160" y="40" width="16" height="16" rx="2.5" fill="#39d353">
        <animate attributeName="opacity" values="1;1;0;0;0;0;1;1;1" keyTimes="0;0.18;0.23;0.28;0.70;0.78;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#39d353;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353;#39d353;#39d353" keyTimes="0;0.18;0.23;0.28;0.70;0.78;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <!-- PASTED BLOCK 3 -->
      <rect x="920" y="40" width="16" height="16" rx="2.5" fill="#161b22">
        <animate attributeName="fill" values="#161b22;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353;#161b22;#161b22" keyTimes="0;0.18;0.23;0.28;0.70;0.78;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;1;1;0;0;0" keyTimes="0;0.18;0.23;0.28;0.70;0.78;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <rect x="158" y="38" width="20" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3">
        <animate attributeName="opacity" values="0;0;1;1;1;0;0;0;0" keyTimes="0;0.18;0.23;0.28;0.70;0.78;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Row 3 -->
    <g>
      <rect x="0" y="60" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="20" y="60" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="40" y="60" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="60" y="60" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="80" y="60" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="100" y="60" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="120" y="60" width="16" height="16" rx="2.5" fill="#0e4429"/>
      
      <!-- SELECTED BLOCK 4 -->
      <rect x="140" y="60" width="16" height="16" rx="2.5" fill="#39d353">
        <animate attributeName="opacity" values="1;1;0;0;0;0;1;1;1" keyTimes="0;0.25;0.30;0.35;0.70;0.80;0.87;0.94;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#39d353;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353;#39d353;#39d353" keyTimes="0;0.25;0.30;0.35;0.70;0.80;0.87;0.94;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <!-- PASTED BLOCK 4 -->
      <rect x="940" y="60" width="16" height="16" rx="2.5" fill="#161b22">
        <animate attributeName="fill" values="#161b22;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353;#161b22;#161b22" keyTimes="0;0.25;0.30;0.35;0.70;0.80;0.87;0.94;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;1;1;0;0;0" keyTimes="0;0.25;0.30;0.35;0.70;0.80;0.87;0.94;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <rect x="138" y="58" width="20" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3">
        <animate attributeName="opacity" values="0;0;1;1;1;0;0;0;0" keyTimes="0;0.25;0.30;0.35;0.70;0.80;0.87;0.94;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Row 4 -->
    <g>
      <rect x="0" y="80" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="20" y="80" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="40" y="80" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="60" y="80" width="16" height="16" rx="2.5" fill="#0e4429"/>
      <rect x="80" y="80" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="100" y="80" width="16" height="16" rx="2.5" fill="#006d32"/>
      <rect x="120" y="80" width="16" height="16" rx="2.5" fill="#26a641"/>
      <rect x="140" y="80" width="16" height="16" rx="2.5" fill="#0e4429"/>
      
      <!-- SELECTED BLOCK 5 -->
      <rect x="160" y="80" width="16" height="16" rx="2.5" fill="#39d353">
        <animate attributeName="opacity" values="1;1;0;0;0;0;1;1;1" keyTimes="0;0.32;0.37;0.42;0.70;0.82;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#39d353;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353;#39d353;#39d353" keyTimes="0;0.32;0.37;0.42;0.70;0.82;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <!-- PASTED BLOCK 5 -->
      <rect x="960" y="80" width="16" height="16" rx="2.5" fill="#161b22">
        <animate attributeName="fill" values="#161b22;#818cf8;#818cf8;#818cf8;#818cf8;#39d353;#39d353;#161b22;#161b22" keyTimes="0;0.32;0.37;0.42;0.70;0.82;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;1;1;0;0;0" keyTimes="0;0.32;0.37;0.42;0.70;0.82;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      
      <rect x="158" y="78" width="20" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3">
        <animate attributeName="opacity" values="0;0;1;1;1;0;0;0;0" keyTimes="0;0.32;0.37;0.42;0.70;0.82;0.88;0.95;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Animated "paste" indicator (arrow/cursor) -->
    <g>
      <!-- Cursor that moves from selection to paste location -->
      <polygon points="0,-8 8,0 4,0 6,8 2,8 0,2 -6,8 -8,8 -4,2 -8,0 -4,-4 -6,-8 -2,-8 0,-4" fill="#e6edf3" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" 
          values="48,10;48,10;48,10;48,10;888,10;888,10;888,10;48,10" 
          keyTimes="0;0.05;0.15;0.20;0.25;0.70;0.85;1" 
          dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.8;0.8;0.8;0.8;0;0" 
          keyTimes="0;0.05;0.10;0.20;0.70;0.80;0.85;1" 
          dur="6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- "COPY" text indicator -->
    <text x="42" y="118" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="8" fill="#818cf8" font-weight="bold">
      SELECT
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.05;0.08;0.12;0.20;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
    </text>
    
    <text x="870" y="118" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="8" fill="#22d3ee" font-weight="bold">
      PASTE
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.05;0.15;0.20;0.25;0.70;0.75;0.85;1" dur="6s" repeatCount="indefinite"/>
    </text>

    <!-- Future weeks glow effect -->
    <rect x="820" y="0" width="180" height="100" rx="6" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.04;0.04;0.04;0;0;0" keyTimes="0;0.05;0.15;0.20;0.70;0.80;0.85;0.95;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Footer -->
  <text x="30" y="260" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="9" letter-spacing="1" fill="#484f58">github.com/utkarshwrks</text>
  <text x="970" y="260" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="8" letter-spacing="1" fill="#484f58">momentum · copy forward</text>

  <!-- Legend -->
  <g transform="translate(30, 240)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#0e4429"/>
    <text x="14" y="9" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="7" fill="#8b949e">past</text>
    <rect x="60" y="0" width="10" height="10" rx="2" fill="#818cf8"/>
    <text x="74" y="9" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="7" fill="#8b949e">selected</text>
    <rect x="130" y="0" width="10" height="10" rx="2" fill="#22d3ee"/>
    <text x="144" y="9" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="7" fill="#8b949e">pasted</text>
  </g>
</svg>
