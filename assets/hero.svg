<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Utkarsh Kushwaha — AI and Backend Engineer">
  <title>Utkarsh Kushwaha — AI &amp; Backend Engineer</title>
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#22d3ee;#c084fc;#818cf8" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#c084fc;#818cf8;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect x="0" y="0" width="880" height="280" rx="16"/>
    </clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace; }
      .fade  { opacity: 0; animation: fade .6s ease forwards; }
      .d1 { animation-delay: .15s; }
      .d2 { animation-delay: .30s; }
      .d3 { animation-delay: .50s; }
      .resp { opacity: 0; animation: fade .5s ease 2.75s forwards; }
      .late { opacity: 0; animation: fade .3s ease 3.15s forwards; }
      .cmd  { clip-path: inset(-2px 100% -6px 0); animation: type 1.7s steps(23, end) .9s forwards; }
      .cursor { opacity: 0; animation: blink 1.1s steps(1, end) 3.4s infinite; }
      .sweep { animation: sweep 4.5s cubic-bezier(.45,0,.55,1) infinite alternate; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes fade  { to { opacity: 1; } }
      @keyframes type  { to { clip-path: inset(-2px -4px -6px 0); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(634px); } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .fade, .resp, .late { opacity: 1; }
        .cursor { opacity: 1; }
        .cmd { clip-path: none; }
      }
    </style>
  </defs>

  <!-- Card -->
  <g clip-path="url(#card)">
    <rect width="880" height="280" rx="16" fill="#0d1117"/>
    <ellipse cx="150" cy="20" rx="360" ry="190" fill="url(#glowL)"/>
    <ellipse cx="760" cy="280" rx="330" ry="190" fill="url(#glowR)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="279" rx="15.5" stroke="#262c33"/>

  <!-- Status: location + live dot -->
  <g class="fade d1">
    <circle cx="678" cy="44" r="4" fill="#3fb950" class="pulse"/>
    <text x="832" y="48.5" text-anchor="end" class="mono" font-size="11" letter-spacing="1.5" fill="#7d8590">INDIA · UTC+05:30</text>
  </g>

  <!-- Kicker -->
  <text x="48" y="57" class="mono fade d1" font-size="12" letter-spacing="4" fill="#7d8590">BACKEND ENGINEERING · AI/ML · REAL-TIME SYSTEMS</text>

  <!-- Name -->
  <text x="46" y="108" class="sans fade d2" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#e6edf3">Utkarsh <tspan fill="url(#nameGrad)">Kushwaha</tspan></text>

  <!-- Role -->
  <text x="48" y="141" class="sans fade d3" font-size="17" fill="#98a3ad">Software Engineer @ Cybokrafts — REST APIs · LLM &amp; GenAI pipelines · real-time data systems</text>

  <!-- Divider + scanning sweep -->
  <rect x="48" y="166" width="784" height="1.5" rx="0.75" fill="#21262d"/>
  <rect x="48" y="165" width="150" height="3" rx="1.5" fill="url(#sweepGrad)" class="sweep"/>

  <!-- Terminal: prompt 1 -->
  <text x="48" y="206" class="mono fade d3" font-size="14"><tspan fill="#3fb950">utkarsh@github</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#7d8590">$</tspan></text>
  <text x="199" y="206" class="mono cmd" font-size="14" fill="#e6edf3">curl -s utkarsh.dev/now</text>

  <!-- Terminal: JSON response -->
  <text x="48" y="234" class="mono resp" font-size="13.5"><tspan fill="#7d8590">{ </tspan><tspan fill="#79c0ff">"now"</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#a5d6ff">"building energy-grid intelligence"</tspan><tspan fill="#7d8590">, </tspan><tspan fill="#79c0ff">"status"</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#ffa657">200</tspan><tspan fill="#7d8590">, </tspan><tspan fill="#79c0ff">"uptime"</tspan><tspan fill="#7d8590">: </tspan><tspan fill="#a5d6ff">"99.9%"</tspan><tspan fill="#7d8590"> }</tspan></text>

  <!-- Terminal: prompt 2 + blinking cursor -->
  <text x="48" y="262" class="mono late" font-size="14"><tspan fill="#3fb950">utkarsh@github</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#7d8590">$</tspan></text>
  <rect x="199" y="250" width="9" height="15" fill="#58a6ff" class="cursor"/>
</svg>
